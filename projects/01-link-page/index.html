<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Links</title>
  <meta name="description" content="개인 링크 모음 페이지">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* 색상 토큰: 라이트/다크 모드를 변수만 바꿔서 전환 */
    :root {
      --bg: #f4f1ec;
      --card: #ffffff;
      --text: #1f1d1a;
      --muted: #6b665e;
      --border: #e4ded4;
      --accent: #d9622b;
      --accent-text: #ffffff;
      --shadow: 0 1px 2px rgba(31, 29, 26, 0.06), 0 4px 12px rgba(31, 29, 26, 0.05);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #161514;
        --card: #211f1d;
        --text: #f1ede6;
        --muted: #a39d93;
        --border: #34312d;
        --accent: #f08a50;
        --accent-text: #161514;
        --shadow: none;
      }
    }
    :root[data-theme="dark"] {
      --bg: #161514;
      --card: #211f1d;
      --text: #f1ede6;
      --muted: #a39d93;
      --border: #34312d;
      --accent: #f08a50;
      --accent-text: #161514;
      --shadow: none;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans KR", system-ui, sans-serif;
      line-height: 1.5;
      transition: background 0.2s, color 0.2s;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 56px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .theme-toggle svg { width: 18px; height: 18px; }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-text);
      display: grid;
      place-items: center;
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .name { font-size: 22px; font-weight: 700; }
    .handle { color: var(--muted); font-size: 14px; margin-top: 2px; }
    .bio {
      color: var(--muted);
      font-size: 15px;
      text-align: center;
      margin-top: 12px;
      max-width: 340px;
    }

    .socials {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }
    .socials a {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--text);
      border: 1px solid var(--border);
      background: var(--card);
      transition: transform 0.15s, border-color 0.15s;
    }
    .socials a:hover { transform: translateY(-2px); border-color: var(--accent); }
    .socials svg { width: 18px; height: 18px; }

    .links {
      list-style: none;
      padding: 0;
      width: 100%;
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s, border-color 0.15s;
    }
    .link:hover { transform: translateY(-2px); border-color: var(--accent); }
    .link:focus-visible, .socials a:focus-visible, .theme-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .link-emoji {
      font-size: 22px;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--bg);
    }
    .link-text { flex: 1; min-width: 0; }
    .link-title, .link-desc { display: block; }
    .link-title { font-weight: 500; font-size: 15px; }
    .link-desc {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .link-arrow { color: var(--muted); flex-shrink: 0; }

    /* 강조 링크: 대표 링크 하나를 눈에 띄게 */
    .link.featured {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }
    .link.featured .link-desc,
    .link.featured .link-arrow { color: var(--accent-text); opacity: 0.8; }
    .link.featured .link-emoji { background: rgba(255, 255, 255, 0.2); }

    .footer {
      margin-top: 40px;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="다크 모드 전환"></button>

  <main class="page">
    <div class="avatar" aria-hidden="true"></div>
    <h1 class="name"></h1>
    <p class="handle"></p>
    <p class="bio"></p>
    <nav class="socials" aria-label="소셜 링크"></nav>
    <ul class="links"></ul>
    <footer class="footer"></footer>
  </main>

  <script>
    // 더미 데이터: 실제 정보로 바꿀 때는 이 객체만 수정하면 된다
    const profile = {
      name: "김코딩",
      handle: "@kimcoding",
      bio: "프론트엔드 개발을 공부하고 있어요. 매일 조금씩 만들고 기록합니다.",
      socials: [
        { type: "github", url: "https://github.com/" },
        { type: "instagram", url: "https://instagram.com/" },
        { type: "youtube", url: "https://youtube.com/" },
        { type: "email", url: "mailto:hello@example.com" },
      ],
      links: [
        { emoji: "🚀", title: "새 프로젝트 데모 보기", desc: "이번 달에 만든 사이드 프로젝트", url: "#", featured: true },
        { emoji: "📝", title: "개발 블로그", desc: "공부한 내용을 정리하는 곳", url: "#" },
        { emoji: "💼", title: "포트폴리오", desc: "지금까지 만든 작업 모음", url: "#" },
        { emoji: "🎙️", title: "팟캐스트 출연 에피소드", desc: "주니어 개발자의 1년 회고", url: "#" },
        { emoji: "☕", title: "커피 한 잔 후원하기", desc: "응원해 주시면 큰 힘이 돼요", url: "#" },
      ],
    };

    const icons = {
      github: '<path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.56 9.56 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z" fill="currentColor"/>',
      instagram: '<rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/>',
      youtube: '<rect x="2" y="5" width="20" height="14" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 9l5 3-5 3z" fill="currentColor"/>',
      email: '<rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 7l9 6 9-6" fill="none" stroke="currentColor" stroke-width="2"/>',
    };
    const svg = (inner) => `<svg viewBox="0 0 24 24" aria-hidden="true">${inner}</svg>`;

    // 사용자 입력이 들어갈 자리이므로 HTML 이스케이프 후 삽입
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    document.querySelector(".avatar").textContent = profile.name.charAt(0);
    document.querySelector(".name").textContent = profile.name;
    document.querySelector(".handle").textContent = profile.handle;
    document.querySelector(".bio").textContent = profile.bio;
    document.querySelector(".footer").textContent = `© ${new Date().getFullYear()} ${profile.name}`;
    document.title = `${profile.name} | Links`;

    document.querySelector(".socials").innerHTML = profile.socials
      .map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener" aria-label="${s.type}">${svg(icons[s.type])}</a>`)
      .join("");

    document.querySelector(".links").innerHTML = profile.links
      .map((l) => `
        <li>
          <a class="link${l.featured ? " featured" : ""}" href="${esc(l.url)}" target="_blank" rel="noopener">
            <span class="link-emoji" aria-hidden="true">${l.emoji}</span>
            <span class="link-text">
              <span class="link-title">${esc(l.title)}</span>
              <span class="link-desc">${esc(l.desc)}</span>
            </span>
            <span class="link-arrow" aria-hidden="true">→</span>
          </a>
        </li>`)
      .join("");

    // 다크 모드: 저장된 선택 > 시스템 설정 순으로 적용
    const root = document.documentElement;
    const toggle = document.querySelector(".theme-toggle");
    const sun = svg('<circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>');
    const moon = svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>');

    const isDark = () =>
      root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    const render = () => { toggle.innerHTML = isDark() ? sun : moon; };

    try {
      const saved = localStorage.getItem("theme");
      if (saved) root.dataset.theme = saved;
    } catch (e) {}
    render();

    toggle.addEventListener("click", () => {
      root.dataset.theme = isDark() ? "light" : "dark";
      try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
      render();
    });
  </script>
</body>
</html>
